# MultiHop-RAG main run, reader = DeepSeek V4 Flash only. DeepSeek builds every index (run.index_llm);
# the RAPTOR tree over the 609 articles is already cached from the sample run.
#
#   .venv/bin/python -u -m ragbench.run configs/experiments/multihop_rag_deepseek.yaml --dry-run
#   .venv/bin/python -u -m ragbench.run configs/experiments/multihop_rag_deepseek.yaml
#   .venv/bin/python -u -m ragbench.judge results/multihop_rag_deepseek
extends: [multihop_rag_main.yaml]

run:
  name: multihop_rag_deepseek
  llm_labels: [deepseek-flash]

# HippoRAG is left out until long articles stop failing extraction (11% gave no
# entities) and the synonym-edge issues are settled. Re-enable the block below after that.
methods:
  - {name: llm_only}
  - {name: full_context, max_context_tokens: 32000}
  - {name: oracle}
  - name: vanilla_rag
    top_k: null
    sweep: {max_context_tokens: [1000, 2000, 4000]}
  - name: dos_rag
    top_k: null
    sweep: {max_context_tokens: [1000, 2000, 4000]}
  - name: raptor
    top_k: null
    sweep: {max_context_tokens: [1000, 2000, 4000]}
  # - name: hipporag
  #   top_k: null
  #   sweep: {max_context_tokens: [1000, 2000, 4000]}
